name: keluh-kesah

services:
  # ---------------- Database ----------------
  db:
    image: mysql:8.4
    container_name: keluhkesah-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend-net

  # ---------------- Backend API (Node.js + Express) ----------------
  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USER:-local}/keluh-kesah-backend:latest
    container_name: keluhkesah-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ---------------- Frontend (Nginx) ----------------
  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USER:-local}/keluh-kesah-frontend:latest
    container_name: keluhkesah-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  # ---------------- Adminer (lihat isi database lewat browser) ----------------
  adminer:
    image: adminer:4
    container_name: keluhkesah-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

networks:
  frontend-net:
  backend-net:

volumes:
  dbdata:
